name: gha-optimizer-mcp
description: Analyze and optimize GitHub Actions workflows - timing stats, config audit, billing usage
author: barissozudogru
license: MIT
repository: https://github.com/barissozudogru/gha-optimizer-mcp
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      GITHUB_TOKEN:
        type: string
        description: GitHub personal access token
    required:
      - GITHUB_TOKEN
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@barissozudogru/gha-optimizer-mcp'],
      env: { GITHUB_TOKEN: config.GITHUB_TOKEN }
    })
