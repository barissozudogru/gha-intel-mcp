name: gha-intel-mcp
description: GitHub Actions intelligence MCP server - workflow timing analysis, configuration audit, and billing insights
author: barissozudogru
license: MIT
repository: https://github.com/barissozudogru/gha-intel-mcp
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      GITHUB_TOKEN:
        type: string
        description: GitHub personal access token
    required:
      - GITHUB_TOKEN
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@barissozudogru/gha-intel-mcp'],
      env: { GITHUB_TOKEN: config.GITHUB_TOKEN }
    })
